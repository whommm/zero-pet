name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 注意：不用 swatinem/rust-cache——曾因恢复旧 tauri 产物导致 SystemTray 未导出编译失败

      - name: Install frontend deps
        run: npm ci

      - name: Debug tauri features
        shell: bash
        run: |
          cd src-tauri
          cargo tree -e features -p tauri 2>&1 | grep -E "^tauri|system-tray|tray-icon" | head -20
          echo '--- tauri version ---'
          cargo tree -p tauri 2>&1 | head -3

      - name: Cargo check (fast feedback)
        shell: bash
        run: |
          npx vite build
          cd src-tauri && cargo check 2>&1 | tail -30

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ZeroPet v__VERSION__'
          releaseBody: '零的桌宠 · 自动构建的 Windows 安装包'
          releaseDraft: true
          prerelease: false
